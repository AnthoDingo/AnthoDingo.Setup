name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How do you picture it (API, options, wizard behavior)?
