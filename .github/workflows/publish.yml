name: Publish NuGet

# Publie à chaque tag de version (ex. 2.1.4) ; la version du package est celle du tag.
on:
  push:
    tags: [ '*.*.*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack src/AnthoDingo.Setup/AnthoDingo.Setup.csproj -c Release -o out -p:Version=${GITHUB_REF_NAME#v}

      - name: Push to GitHub Packages
        run: dotnet nuget push "out/*.nupkg" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Push to nuget.org
        run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
